[platformio]
default_envs = esp32-3248s035
description = Demo hub - mode-select menu for the Gemini Chatbot and Digital Andon demos

[env:esp32-3248s035]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
  lib/lvgl
  lib/TFT_eSPI
  WiFi
  HTTPClient
  ArduinoJson


[platformio]
default_envs = esp32-3248s035
description = Andon system for the ESP32-3248S035 (lvgl + touch + backend config sync)

[env:esp32-3248s035]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
; Needed once WiFi/HTTPClient/ArduinoJson are linked in (see
; AndonConfig::sync(), andon_config.cpp) - same reason
; examples/gemini-chatbot needs it, see that project's CLAUDE.md note.
board_build.partitions = huge_app.csv
lib_deps =
  lib/lvgl
  lib/TFT_eSPI
  WiFi
  HTTPClient
  ArduinoJson
  Preferences
  knolleary/PubSubClient@^2.8 ; MQTT client - see andon_mqtt.cpp (QoS 0 only, see that file's header comment)


# Local dev/test compose for the Digital Andon backend - see
# ../backend/src/server.ts's header comment for scope (minimal test
# backend, in-memory only, no auth - not the production deployment
# agents.md §10/§12 describe). Ports are published on the host so an ESP32
# on the same LAN can reach them - point secrets.h's CONFIG_API_BASE_URL at
# this host's LAN IP (not localhost/127.0.0.1 - the device can't resolve
# that to your machine) and port 8080; MQTT broker is on port 1883.
#
# Run from this directory: `docker compose up --build`
services:
  backend:
    build:
      context: ../backend
    container_name: andon-backend
    ports:
      - "8080:8080" # HTTP - GET /api/v1/configuration/stations/:stationId
      - "1883:1883" # MQTT - andon/v1/... (see architectur.md §8)
    environment:
      HTTP_PORT: "8080"
      MQTT_PORT: "1883"
    restart: unless-stopped

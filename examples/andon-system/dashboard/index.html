<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Andon — Dashboard</title>
  </head>
  <body>
    <div id="alerts"></div>

    <header>
      <h1>Digital Andon — Live Board</h1>
      <span id="connection-status">○ Connecting…</span>
    </header>

    <main>
      <div class="main-col">
        <section>
          <h2>Active incidents</h2>
          <div id="active-board"></div>
        </section>

        <section>
          <h2>Andon calls by category</h2>
          <div id="category-chart"></div>
        </section>
      </div>

      <div class="sidebar">
        <section>
          <h2>Production</h2>
          <div id="production-tiles"></div>
        </section>

        <section>
          <h2>
            OEE
            <span
              class="section-note"
              title="Simplified estimate, not audit-grade: Availability uses a fixed 8h planned shift and counts every incident as downtime regardless of category; Performance compares actual output to work-order target quantity (no measured ideal cycle time exists in this system); Quality is real (good / (good + reject))."
              >(approximate, hover for details)</span
            >
          </h2>
          <div id="oee-tiles"></div>
        </section>

        <section>
          <h2>Recently resolved</h2>
          <ul id="resolved-list"></ul>
        </section>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

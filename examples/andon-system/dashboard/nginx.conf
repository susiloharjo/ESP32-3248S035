# Serves the built static dashboard and reverse-proxies /api (REST +
# WebSocket - PLAN.md §2) to the backend service, so the browser only ever
# talks to this one origin. See ../deploy/docker-compose.yml for how
# "backend" resolves as a hostname (Docker's internal DNS).
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
